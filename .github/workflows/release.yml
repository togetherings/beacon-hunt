name: Release

# Publish a release on GitHub (Releases > Draft a new release) with a tag like
# v0.1.0. This builds the game's zip and attaches it to the release. The tag
# must match __version__ in beacon_pack/__init__.py.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check the tag matches the version
        run: |
          VERSION="$(python -c 'import beacon_pack; print(beacon_pack.__version__)')"
          test "v$VERSION" = "$TAG" || { echo "::error::Tag $TAG doesn't match version $VERSION in beacon_pack/__init__.py"; exit 1; }
      - run: pip install pytest pillow -e . "kolibri-games @ git+https://github.com/togetherings/kolibri-games@main"
      - run: tools/ci_run.sh "Unit tests" python -m pytest -q
      - run: tools/ci_run.sh "Build" bash tools/build_release.sh
      - name: Attach the files to the release
        run: |
          VERSION="${TAG#v}"
          notes="$(awk -v v="$VERSION" '$0 ~ "^## " v {f=1; next} /^## / && f {exit} f' CHANGELOG.md)"
          gh release upload "$TAG" dist/*.zip dist/SHA256SUMS --clobber
          if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
            gh release edit "$TAG" --notes "$notes"
          fi
